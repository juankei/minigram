@if (post(); as p) {
  <mat-card class="post-card" appearance="outlined">

    <mat-card-header class="post-header">
      @if (p.avatar_filename) {
        <img mat-card-avatar class="post-avatar"
             [src]="apiUrl + p.avatar_filename"
             [alt]="p.username">
      } @else {
        <div mat-card-avatar class="post-avatar post-avatar--fallback">
          {{ p.username.charAt(0).toUpperCase() }}
        </div>
      }
      <mat-card-title class="post-user">{{ p.username }}</mat-card-title>
    </mat-card-header>

    <img mat-card-image class="post-image"
         [src]="apiUrl + p.image_filename"
         [alt]="p.caption">

    <mat-card-actions class="post-actions">
      <button
        matButton
        class="like-button"
        [class.like-button--active]="hasLiked()"
        [disabled]="likeLoading()"
        [attr.aria-pressed]="hasLiked()"
        [attr.aria-label]="hasLiked() ? 'Quitar me gusta' : 'Dar me gusta'"
        (click)="toggleLike()"
      >
        <mat-icon>{{ hasLiked() ? 'favorite' : 'favorite_border' }}</mat-icon>
        <span class="like-count">{{ likes() }}</span>
      </button>
      <button matButton class="post-share">SHARE</button>

      @if (isOwnPost(p)) {
        <button
          matButton
          class="delete-button"
          [disabled]="deleting()"
          title="Eliminar publicación"
          aria-label="Eliminar publicación"
          (click)="deletePost(p.id)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      }
    </mat-card-actions>

    <mat-card-content class="post-content">
      <p><strong>{{ p.username }}</strong> {{ p.caption }}</p>
    </mat-card-content>


  <!-- Comentarios de esta publicación -->
  <app-comments [postId]="p.id"></app-comments>

  </mat-card>
}
