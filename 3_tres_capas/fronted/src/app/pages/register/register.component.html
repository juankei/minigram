<div class="register-page">
  <mat-card class="register-card" appearance="outlined">

    <mat-card-header>
      <mat-card-title>Crear cuenta</mat-card-title>
      <mat-card-subtitle>Regístrate para usar Minigram</mat-card-subtitle>
    </mat-card-header>

    <form class="register-form" (submit)="submit($event)">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nombre de usuario</mat-label>
        <input matInput type="text" name="username" autocomplete="username"
               placeholder="tu usuario"
               (input)="username.set($any($event.target).value)">
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="email" name="email" autocomplete="email"
               placeholder="tu@correo.com"
               (input)="email.set($any($event.target).value)">
        <mat-icon matSuffix>mail</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" name="password" autocomplete="new-password"
               placeholder="mínimo 6 caracteres"
               (input)="password.set($any($event.target).value)">
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      @if (error()) {
        <p class="register-error">{{ error() }}</p>
      }

      <button mat-raised-button type="submit" class="register-button"
              [disabled]="loading()">
        <mat-icon>person_add</mat-icon>
        {{ loading() ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>

    <mat-card-footer>
      <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </mat-card-footer>

  </mat-card>
</div>
